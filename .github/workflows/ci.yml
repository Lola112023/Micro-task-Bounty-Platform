name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # =========================================================================
  # Frontend — typecheck, lint, test, build
  # =========================================================================
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npm run typecheck
        working-directory: frontend

      - name: Test
        run: npm run test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # =========================================================================
  # Backend — compile, test
  # =========================================================================
  backend:
    name: Backend (Java 17)
    runs-on: ubuntu-latest
    needs: frontend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Build & test backend
        run: |
          chmod +x ./mvnw
          ./mvnw -B verify -DskipTests=false
        working-directory: backend

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: JUnit Tests
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

  # =========================================================================
  # Package — full JAR with embedded frontend
  # =========================================================================
  package:
    name: Package JAR
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Package JAR
        run: |
          chmod +x ./mvnw
          ./mvnw -B package -DskipTests
        working-directory: backend

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: backend/target/TaskBountyPlatform-*.jar
          retention-days: 7

  # =========================================================================
  # Docs — Javadoc + OpenAPI spec
  # =========================================================================
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Generate Javadoc
        run: |
          chmod +x ./mvnw
          ./mvnw -B javadoc:javadoc -DskipTests
        working-directory: backend

      - name: Upload Javadoc
        uses: actions/upload-artifact@v4
        with:
          name: javadoc
          path: backend/target/site/apidocs/

      - name: Start app for OpenAPI export
        run: |
          chmod +x ./mvnw
          nohup ./mvnw -B spring-boot:run -Dspring-boot.run.profiles=test > /tmp/app.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s http://localhost:8080/v3/api-docs 2>/dev/null | grep -q openapi && break
            sleep 2
          done
        working-directory: backend

      - name: Export OpenAPI spec
        run: curl -s http://localhost:8080/v3/api-docs -o backend/target/openapi.json

      - name: Stop app
        run: kill $(lsof -t -i:8080) 2>/dev/null || true

      - name: Upload OpenAPI spec
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: backend/target/openapi.json
          retention-days: 7
